name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t demo .

      - name: Tag image
        run: |
          docker tag demo:latest ${{ secrets.ECR_REPO }}:latest

      - name: Push image
        run: |
          docker push ${{ secrets.ECR_REPO }}:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name platform-eks

      - name: Deploy
        run: |
          kubectl apply -f kubernetes/

### For this workflow to work securely with OIDC, you must create an IAM role that GitHub can assume, and that role needs permissions for both ECR and EKS (and indirectly Kubernetes access).
